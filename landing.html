<style>
  body.landing {
    padding-top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .landing-wrap { width: 100%; max-width: 400px; }
  .landing-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .landing-icon { width: 56px; height: 56px; flex-shrink: 0; }
  .landing-title {
    margin: 0;
    font-size: 1.85rem;
    font-weight: 700;
    color: var(--px-navy);
    white-space: nowrap;
  }
  .landing-tagline {
    margin: 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.5;
  }
  .landing-cta { text-decoration: none; }
</style>
</head>
<body class="landing">

<div class="landing-wrap">
  <div class="px-window">
    <div class="px-titlebar">
      <span class="px-titlebar-label">New!</span>
      <span class="px-titlebar-controls">
        <span class="px-deco-btn" aria-hidden="true"><img src="assets/icons/deco-help.svg" alt=""></span>
        <span class="px-deco-btn" aria-hidden="true"><img src="assets/icons/deco-close.svg" alt=""></span>
      </span>
    </div>
    <div class="px-body">
      <div class="landing-brand">

      <p class="landing-tagline">¿Bloqueo creativo? Te ayudamos generando ideas para dibujar :)</p>
      <a href="index.html" class="px-primary-btn px-primary-btn--blue landing-cta">
        <img src="assets/icons/star.svg" class="px-btn-icon" alt="">
        <span>Probar app</span>
      </a>
    </div>
  </div>
</div>

<img src="assets/icons/decor-bottom.svg" class="px-decor" alt="" aria-hidden="true">
