<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What to Draw — Generador de ideas</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3F5BA4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="What to Draw">
<meta name="description" content="Generador de ideas para dibujar: elige una categoría, combina elementos y recibe una idea única para dibujar.">
<meta property="og:type" content="website">
<meta property="og:title" content="What to Draw">
<meta property="og:description" content="Generador de ideas para dibujar: elige una categoría, combina elementos y recibe una idea única para dibujar.">
<meta property="og:image" content="https://malefice-design.github.io/what-to-draw/assets/branding/og-image.png">
<meta property="og:url" content="https://malefice-design.github.io/what-to-draw/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="What to Draw">
<meta name="twitter:description" content="Generador de ideas para dibujar: elige una categoría, combina elementos y recibe una idea única para dibujar.">
<meta name="twitter:image" content="https://malefice-design.github.io/what-to-draw/assets/branding/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="px-header">
  <button id="btn-back" class="px-icon-btn" aria-label="Atrás">
    <img src="assets/icons/back-arrow.svg" class="px-icon-img" alt="">
  </button>
  <h1 id="header-title" class="px-header-title">¿Qué quieres dibujar?</h1>
  <button id="btn-favs" class="px-icon-btn" aria-label="Favoritos">
    <img src="assets/icons/heart-outline.svg" class="px-icon-img" alt="">
  </button>
</header>

<main id="app">

  <!-- PANTALLA 1: elegir categorías -->
  <section id="screen-categories" class="screen active">
    <div class="px-window">
      <div class="px-titlebar">
        <span class="px-titlebar-label">Elige una categoría:</span>
        <span class="px-titlebar-controls">
          <span class="px-deco-btn" aria-hidden="true"><img src="assets/icons/deco-help.svg" alt=""></span>
          <span class="px-deco-btn" aria-hidden="true"><img src="assets/icons/deco-close.svg" alt=""></span>
        </span>
      </div>
      <div class="px-body">
        <div id="category-grid" class="px-pill-list"></div>
        <button id="btn-to-slots" class="px-primary-btn px-primary-btn--pink" disabled>
          <span>Continuar</span>
          <img src="assets/icons/back-arrow.svg" class="px-btn-icon px-btn-icon--flip" alt="">
        </button>
      </div>
    </div>
  </section>

  <!-- PANTALLA 2: elegir elementos del prompt -->
  <section id="screen-slots" class="screen">
    <div class="px-window">
      <div class="px-titlebar">
        <span class="px-titlebar-label">Elige qué elementos quieres:</span>
        <span class="px-titlebar-controls">
          <span class="px-deco-btn" aria-hidden="true"><img src="assets/icons/deco-help.svg" alt=""></span>
          <span class="px-deco-btn" aria-hidden="true"><img src="assets/icons/deco-close.svg" alt=""></span>
        </span>
      </div>
      <div id="category-banner" class="px-category-banner"></div>
      <div class="px-body">
        <div id="slot-grid" class="px-pill-grid"></div>
        <button id="btn-generate" class="px-primary-btn px-primary-btn--indigo" disabled>
          <img src="assets/icons/star-white.svg" class="px-btn-icon" alt="">
          <span>Generar idea</span>
        </button>
      </div>
    </div>
  </section>

  <!-- PANTALLA 3: resultado -->
  <section id="screen-result" class="screen">
    <div class="px-window">
      <div class="px-titlebar">
        <span class="px-titlebar-label">Tu idea para dibujar:</span>
        <span class="px-titlebar-controls">
          <span class="px-deco-btn" aria-hidden="true"><img src="assets/icons/deco-help.svg" alt=""></span>
          <span class="px-deco-btn" aria-hidden="true"><img src="assets/icons/deco-close.svg" alt=""></span>
        </span>
      </div>
      <div class="px-body">
        <p id="result-phrase" class="px-result-phrase"></p>
        <div class="px-result-actions">
          <button id="btn-undo" class="px-icon-btn px-icon-btn--lg" aria-label="Anterior" title="Frase anterior">
            <img src="assets/icons/undo.svg" class="px-icon-img-lg" alt="">
          </button>
          <button id="btn-fav-toggle" class="px-icon-btn px-icon-btn--lg" aria-label="Favorito" title="Guardar en favoritos">
            <img id="result-fav-icon" src="assets/icons/heart-outline.svg" class="px-icon-img-lg" alt="">
          </button>
        </div>
        <button id="btn-regenerate" class="px-primary-btn px-primary-btn--blue">
          <img src="assets/icons/star.svg" class="px-btn-icon" alt="">
          <span>Nueva frase</span>
        </button>
      </div>
    </div>
  </section>

  <!-- PANTALLA 4: favoritos -->
  <section id="screen-favorites" class="screen">
    <p class="screen-hint">Tus ideas guardadas.</p>
    <div id="favorites-list" class="favorites-list"></div>
    <p id="favorites-empty" class="empty-msg hidden">Aún no guardaste ninguna idea. Toca el corazón en una frase para guardarla aquí.</p>
  </section>

</main>

<img src="assets/icons/decor-bottom.svg" class="px-decor" alt="" aria-hidden="true">

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
